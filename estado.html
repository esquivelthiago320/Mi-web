<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estado de la Recarga</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-image: url('https://sm.ign.com/t/ign_latam/screenshot/default/free-fire-max-preregistro_prtv.1200.jpg');
            background-attachment: fixed;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 15px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 480px;
            width: 100%;
            background-color: rgba(15, 23, 42, 0.90);
            border-radius: 16px;
            padding: 30px 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }
        h2 { color: #22c55e; margin-bottom: 10px; }
        p { color: #cbd5e1; font-size: 14px; }
        .code-box {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 15px;
            margin: 20px 0;
        }
        .code-box span {
            font-size: 18px;
            font-weight: bold;
            color: #a7f3d0;
        }
        .status-badge {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid #22c55e;
            color: #22c55e;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .btn-home {
            background-color: #22c55e;
            color: #0b0f19;
            padding: 14px;
            border: none;
            border-radius: 12px;
            width: 100%;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🎉 ¡Recarga solicitada!</h2>
        <p>Gracias por confiar en nosotros. Tu pedido está siendo verificado por nuestro equipo.</p>
        
        <div class="code-box">
            <p style="margin: 0 0 5px 0; font-size: 12px;">Nº de Referencia:</p>
            <span id="orderCode">REC-000000</span>
        </div>

        <div class="status-badge">
            Estado: En proceso 🔄
        </div>

        <a href="index.html" class="btn-home">Volver al inicio</a>
    </div>

    <script>
        const savedCode = localStorage.getItem('lastOrderCode');
        if (savedCode) {
            document.getElementById('orderCode').textContent = savedCode;
        }
    </script>
</body>
</html>
