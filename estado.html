<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estado de la Recarga</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: Arial, sans-serif;
            padding: 15px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 480px;
            width: 100%;
            background-color: rgba(15, 23, 42, 0.95);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }
        h2 { color: #22c55e; margin-bottom: 10px; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
        .ref-box {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
        }
        .ref-box span { display: block; font-size: 12px; color: #64748b; margin-bottom: 5px; }
        .ref-box strong { font-size: 22px; color: #ffffff; letter-spacing: 2px; }
        .copy-btn {
            background: #22c55e;
            color: #0b0f19;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: 0.2s;
            margin-top: 10px;
            width: 100%;
        }
        .copy-btn:hover { background: #16a34a; }
        .status-badge {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid #22c55e;
            color: #22c55e;
            padding: 12px;
            border-radius: 12px;
            font-weight: bold;
            margin-bottom: 25px;
            display: block;
        }
        .btn-home {
            background-color: #334155;
            color: #ffffff;
            padding: 16px;
            border: none;
            border-radius: 12px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            transition: 0.2s;
            text-decoration: none;
            display: block;
        }
        .btn-home:hover { background-color: #475569; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🎉 ¡Recarga solicitada!</h2>
        <p>Gracias por confiar en nosotros. Tu pedido está siendo verificado por nuestro equipo.</p>
        
        <div class="ref-box">
            <span>Nº de Referencia:</span>
          <strong id="order-display"></strong>

          <button class="copy-btn" onclick="copyReference(localStorage.getItem('orderId'))">Copiar Referencia</button>

        </div>

        <div class="status-badge">Estado: En proceso 🔄</div>

        <a href="index.html" class="btn-home">Volver al inicio</a>
    </div>

    <script>
        function copyReference(text) {
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.querySelector('.copy-btn');
                const originalText = btn.innerText;
                btn.innerText = '¡Copiado!';
                btn.style.background = '#10b981';
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.style.background = '#22c55e';
                }, 2000);
            });
        }
      const firebaseConfig = {
  apiKey: "AIzaSyAKkDmoLDIU-tLna0M-YAOzJcLhy24HzkM",
  authDomain: "diamond-king-dc02f.firebaseapp.com",
  projectId: "diamond-king-dc02f",
  storageBucket: "diamond-king-dc02f.firebasestorage.app",
  messagingSenderId: "385403829390",
  appId: "1:385403829390:web:8185759340ee44a858dddf",
  measurementId: "G-K7FQCF3S2V"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
    </script>
  <script>
  document.getElementById('order-display').innerText = localStorage.getItem('orderId');
</script>

</body>
</html>
